name: ReliefNet CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # CI: Backend Testing & Syntax Verification
  # ==========================================
  test-backend:
    name: Backend CI (Test & Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci || npm install

      - name: Run backend syntax verification
        run: npm test

  # ==========================================
  # CI: Frontend Linting & Build Verification
  # ==========================================
  build-frontend:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Run linter
        run: npm run lint || echo "Linter completed with warnings"

      - name: Test production build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://reliefnet-backend.onrender.com/api' }}

  # ==========================================
  # CD: Trigger Render Backend Deployment
  # ==========================================
  deploy-render:
    name: CD - Deploy Backend to Render
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment hook on Render..."
          response=$(curl -s -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" -o /tmp/deploy_response.txt)
          echo "Render response code: $response"
          cat /tmp/deploy_response.txt
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Failed to trigger Render deploy hook"
            exit 1
          fi
          echo "Render deployment triggered successfully!"

  # ==========================================
  # CD: Deploy Frontend to Vercel
  # ==========================================
  deploy-vercel:
    name: CD - Deploy Frontend to Vercel
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Action
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
