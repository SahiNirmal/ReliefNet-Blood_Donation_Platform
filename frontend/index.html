<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("reliefnet-theme"); } catch {}
        const dark = preference === "dark" ||
          (preference !== "light" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", Boolean(dark));
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/pulse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReliefNet — Real-Time Blood Donor & Emergency Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
