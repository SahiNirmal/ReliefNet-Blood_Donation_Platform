services:
  # ==========================================
  # Database Service: MongoDB
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: reliefnet-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - reliefnet-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend Service: Express + Socket.IO REST API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reliefnet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/reliefnet
      JWT_SECRET: reliefnet_super_secret_jwt_key_docker_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - reliefnet-net

  # ==========================================
  # Frontend Service: React 19 + Vite (Nginx SPA)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: reliefnet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - reliefnet-net

# ==========================================
# Persistent Volumes & Custom Bridge Network
# ==========================================
volumes:
  mongo_data:
    driver: local

networks:
  reliefnet-net:
    driver: bridge
